server:
  port: 1314
spring:
  application:
    name: gateway-server
  cloud:
    sentinel:
      transport:
        dashboard: localhost:1111
    nacos:
      discovery:
        server-addr: 192.168.182.6:8848
    gateway:
      discovery:
        locator:
          enabled: false #开放服务名访问方式
          lower-case-service-id: true #服务名小写
      routes:
        - id: application-login-register #指定服务名
          uri: lb://login-register #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/login-register/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /login_register访问路径
        - id: application-kehufuwu #指定服务名
          uri: lb://customer-service-center #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/kehufuwu/**    #服务访问路径
          filters:
            - StripPrefix=1
        - id: application-kufang #指定服务名
          uri: lb://kufang #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/kufang/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /kehufuwu
        - id: application-fenzhan #指定服务名
          uri: lb://fenzhan #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/fenzhan/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /kehufuwu
        - id: application-caiwu #指定服务名
          uri: lb://finance-center #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/caiwu/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /caiwu
        - id: application-peisong #指定服务名
          uri: lb://peisong-center #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/peisong/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /caiwu
        - id: application-diaodu #指定服务名
          uri: lb://diaodu-center #去注册中心找这个服务名
          predicates: #断言，匹配访问的路径
            - Path=/diaodu/**    #服务访问路径
          filters:
            - StripPrefix=1    #请求转发的时候会去掉 /caiwu
      globalcors: # 全局的跨域处理
        add-to-simple-url-handler-mapping: true # 解决options请求被拦截问题
        corsConfigurations:
          '[/**]':
            allowedOrigins: # 允许哪些网站的跨域请求
              - "http://localhost:8080"
            allowedMethods: # 允许的跨域ajax的请求方式
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*" # 允许在请求中携带的头信息
            allowCredentials: true # 是否允许携带cookie
            maxAge: 360000 # 这次跨域检测的有效期
